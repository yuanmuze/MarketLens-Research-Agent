name: MarketLens CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketlens
          POSTGRES_PASSWORD: marketlens
          POSTGRES_DB: marketlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.3

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra db --extra embeddings

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src scripts

      - name: Run migrations
        env:
          MARKETLENS_DATABASE_URL: postgresql+psycopg2://marketlens:marketlens@localhost:5432/marketlens_test
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Unit tests (no real LLM)
        run: uv run pytest -m "not postgres" -q -rs

      - name: PostgreSQL integration tests
        env:
          MARKETLENS_TEST_DATABASE_URL: postgresql+psycopg2://marketlens:marketlens@localhost:5432/marketlens_test
        run: uv run pytest -m postgres -q -rs
