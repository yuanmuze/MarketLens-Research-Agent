[project]
name = "marketlens-research-agent"
version = "0.2.0"
description = "Offline-first product research API with hybrid retrieval, PostgreSQL/pgvector, and evidence-validated agent workflows."
authors = [{ name = "yuanmuze" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115.0",
    "langgraph>=0.5.4",
    "numpy>=2.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "typing-extensions>=4.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
data = ["datasets>=2.14.0", "pyarrow>=15.0", "requests>=2.32.3"]
embeddings = [
    "sentence-transformers>=2.2.0",
    "torch==2.13.0+cpu",
]
llm = ["openai>=1.99.2"]

[dependency-groups]
dev = [
    "httpx>=0.24.0",
    "mypy>=1.11.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.12.0",
    "ruff==0.16.3",
]

[project.urls]
Repository = "https://github.com/yuanmuze/MarketLens-Research-Agent"
Issues = "https://github.com/yuanmuze/MarketLens-Research-Agent/issues"
Documentation = "https://github.com/yuanmuze/MarketLens-Research-Agent/tree/main/docs"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["marketlens*"]
namespaces = false

[tool.setuptools.package-data]
marketlens = ["py.typed", "fixtures/*.json", "fixtures/*.jsonl"]

[tool.ruff]
exclude = ["data", "dist"]
lint.select = ["E", "F", "I", "D", "D401", "T201", "UP"]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"src/marketlens/evaluation/benchmark.py" = ["T201"]
"scripts/benchmark_api.py" = ["T201"]
"scripts/demo_retrieval.py" = ["T201", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: PostgreSQL integration tests (require a dedicated database whose name contains 'test')",
]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
python_version = "3.12"
files = ["src/marketlens", "scripts"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
