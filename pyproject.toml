[project]
name = "marketlens-research-agent"
version = "0.1.0"
description = "MarketLens Research Agent — vertical product research system for AI/electronics with evidence-grounded recommendations."
authors = [
    { name = "Lance Martin" },
    { name = "MarketLens Developer" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.5.4",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-deepseek>=0.1.2",
    "langchain-tavily",
    "langchain-groq>=0.2.4",
    "openai>=1.99.2",
    "tavily-python>=0.5.0",
    "arxiv>=2.1.3",
    "pymupdf>=1.25.3",
    "xmltodict>=0.14.2",
    "linkup-sdk>=0.2.3",
    "duckduckgo-search>=3.0.0",
    "exa-py>=1.8.8",
    "requests>=2.32.3",
    "beautifulsoup4==4.14.3",
    "python-dotenv>=1.0.1",
    "pytest",
    "httpx>=0.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "markdownify>=0.11.6",
    "azure-identity>=1.21.0",
    "azure-search>=1.0.0b2",
    "azure-search-documents>=11.5.2",
    "rich>=13.0.0",
    "langgraph-cli[inmem]>=0.3.1",
    "langsmith>=0.3.37",
    "langchain-google-vertexai>=2.0.25",
    "langchain-google-genai>=2.1.5",
    "ipykernel>=6.29.5",
    "supabase>=2.15.3",
    "mcp>=1.9.4",
    "langchain-aws>=0.2.28",
    "pandas>=2.3.1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest-mock>=3.12.0"]
embeddings = ["sentence-transformers>=2.2.0"]
data = ["datasets>=2.14.0"]
db = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg2-binary>=2.9", "pgvector>=0.3.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["open_deep_research", "marketlens", "marketlens.retrieval", "marketlens.agent", "marketlens.agent.providers", "marketlens.api", "marketlens.evaluation", "marketlens.persistence", "legacy", "tests"]

[tool.setuptools.package-dir]
"open_deep_research" = "src/open_deep_research"
"marketlens" = "src/marketlens"
"marketlens.retrieval" = "src/marketlens/retrieval"
"marketlens.agent" = "src/marketlens/agent"
"marketlens.agent.providers" = "src/marketlens/agent/providers"
"marketlens.api" = "src/marketlens/api"
"marketlens.evaluation" = "src/marketlens/evaluation"
"marketlens.persistence" = "src/marketlens/persistence"
"legacy" = "src/legacy"
"tests" = "tests"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
# Vendored/legacy upstream code is excluded from linting.
# src/legacy/ and src/open_deep_research/ are from the original Open Deep
# Research upstream (langchain-ai/open_deep_research), kept for reference only.
exclude = [
    "src/legacy",
    "src/open_deep_research",
    "src/security",
    "tests/evaluators.py",
    "tests/extract_langsmith_data.py",
    "tests/pairwise_evaluation.py",
    "tests/prompts.py",
    "tests/run_evaluate.py",
    "tests/supervisor_parallel_evaluation.py",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"src/marketlens/evaluation/benchmark.py" = ["T201"]
"scripts/demo_retrieval.py" = ["T201", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
# Only collect first-party MarketLens tests. Legacy upstream tests
# (src/legacy/tests/) require API keys (LangSmith + LLM) and are excluded.
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: PostgreSQL integration tests (require a running test database)",
]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
python_version = "3.11"
files = ["src/marketlens", "scripts"]
exclude = [
    "src/legacy",
    "src/open_deep_research",
    "src/security",
]
