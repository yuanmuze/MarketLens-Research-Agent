version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MARKETLENS_DATABASE_URL=postgresql://marketlens:marketlens@db:5432/marketlens
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: marketlens
      POSTGRES_DB: marketlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
