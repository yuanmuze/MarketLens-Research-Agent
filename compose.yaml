# Development services — NOT a full deployment.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: marketlens
      POSTGRES_DB: marketlens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      MARKETLENS_DATABASE_URL: "postgresql+psycopg2://marketlens:marketlens@db:5432/marketlens"
      MARKETLENS_CATALOG_BACKEND: "json"
      MARKETLENS_USE_FAKE_EMBEDDINGS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
